---
name: Checks

# The checks of the Go-code workflow (go.yml), using only GitHub-owned actions: build, unit
# tests, formatting, golangci-lint and the integration tests.
#
# go.yml reports formatting and lint through third-party reviewdog actions. Where the Actions
# policy of a repository allows only GitHub-owned actions, a workflow that references any
# other action does not start at all, so go.yml cannot run there. This workflow runs the
# tools directly instead. Formatting and lint cover the code a pull request changes, and fail
# the job instead of posting review suggestions.

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build
      - run: ./bin/pcsm version

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -v ./...

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install golang.org/x/tools/cmd/goimports@v0.49.0
      - run: go install mvdan.cc/gofumpt@v0.11.0
      - name: Check the Go files changed by this pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.go')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Go files changed."
            exit 0
          fi

          unformatted="$({
            goimports -l -local "github.com/percona" "${files[@]}"
            gofumpt -l -extra "${files[@]}"
          } | sort -u)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not formatted. Run: goimports -w -local github.com/percona <file> && gofumpt -w -extra <file>"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # go.yml pins v2.13.2. Built from source with Go 1.27 that version cannot load the
      # packages ("export data version 5 is greater than maximum supported version 4").
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint the code changed by this pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: golangci-lint run --new-from-merge-base="origin/$BASE_REF"

  integration:
    name: Integration (MongoDB ${{ matrix.mongo_version }})
    # Keep MongoDB jobs on the compatible runner documented in ci.yml.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongo_version: ["6.0.29-23", "7.0.40-22", "8.0.29-13"]
    env:
      MONGO_VERSION: ${{ matrix.mongo_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test-integration
